services:
  db:
    image: postgres:latest
    container_name: gsb-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gsb_postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d gsb_postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  cron:
    build:
      context: .
      dockerfile: apps/cron/Dockerfile
    container_name: gsb-cron
    restart: always
    env_file:
      - apps/cron/.env
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gsb-api
    restart: always
    env_file:
      - apps/api/.env
    ports:
      - "3000:3000"
    networks:
      - internal
    depends_on:
      cron:
        condition: service_started
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: gsb-web
    restart: always
    env_file:
      - apps/web/.env
    ports:
      - "8080:8080"
    networks:
      - internal
    depends_on:
      api:
        condition: service_started
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - internal
networks:
  internal:
    driver: bridge

volumes:
  pgdata:
    name: gsb_volume
